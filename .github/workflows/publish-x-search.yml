name: publish x-search

# The search tool is its own package: it releases on its own commits, and the root
# package (files: bin/ lib/ skills/ docs/) never carries it.
#
# Its tests need both halves of the tool's runtime — the sqlite-vec binary this
# package installs, and an Ollama embedder — so the job installs the embedder rather
# than letting the suite fail on a machine that has neither. It publishes with OIDC
# trusted publishing, the same way the root package does; a token would need a secret
# this repository does not keep.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/x-search/**"
      - "test/x-search*.test.cjs"
      - ".github/actions/ollama/**"
      - ".github/workflows/publish-x-search.yml"

permissions:
  contents: read
  id-token: write # to publish with provenance, no token

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/x-search
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # `npm ci` with no `|| npm install` behind it: a lockfile that has drifted from its manifest is
      # a failure worth reading, and the silent re-resolve the fallback did hid exactly one.
      - run: npm ci --no-audit --no-fund
      # Grammar packages are the tool's business to install, and this repository keeps
      # them as devDependencies because the suite exercises the tree-sitter path. They
      # have to be here, or the chunker tests fall back to windows and fail.
      - name: Install the repository's dev dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci --no-audit --no-fund
      - name: Start the embedder the tests call
        uses: ./.github/actions/ollama
      # The repository's own gate. The tests live with the repository's, so this package's `npm test`
      # matched an empty directory and passed with nothing to verify; the root command runs the same
      # suite the release does, after provisioning what it needs.
      - name: Run the tests
        working-directory: ${{ github.workspace }}
        run: npm test
      - name: publish when the version is new
        run: |
          set -euo pipefail
          local_version=$(node -p "require('./package.json').version")
          published=$(npm view "$(node -p "require('./package.json').name")" version 2>/dev/null || echo none)
          if [ "$local_version" = "$published" ]; then
            echo "version $local_version is already published"
            exit 0
          fi
          npm publish --provenance --access public
